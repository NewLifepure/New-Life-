<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نيو لايف - المهام</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
  <div class="overlay-bg" id="overlayBg" onclick="toggleSidebar()"></div>

  <div class="layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="main-content">
      <div class="page-header">
        <div>
          <div class="page-title">المهام والزيارات</div>
          <div class="page-subtitle">إدارة مهام الفنيين والموافقة على الزيارات</div>
        </div>
        <button class="btn btn-primary" onclick="openAssignModal()">+ تعيين مهمة لفني</button>
      </div>

      <!-- Tabs -->
      <div style="display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap">
        <button class="btn btn-primary btn-sm" id="tab_pending" onclick="setTab('pending')">⏳ تنتظر موافقة</button>
        <button class="btn btn-outline btn-sm" id="tab_all" onclick="setTab('all')">📋 كل المهام</button>
        <button class="btn btn-outline btn-sm" id="tab_confirmed" onclick="setTab('confirmed')">✅ مؤكدة</button>
        <button class="btn btn-outline btn-sm" id="tab_assigned" onclick="setTab('assigned')">📤 معينة للفنيين</button>
      </div>

      <div id="tasksContainer"></div>
    </div>
  </div>

  <!-- Assign Task Modal -->
  <div class="modal-overlay" id="assignModal" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">تعيين مهمة لفني</div>
        <button class="modal-close" onclick="hideModal('assignModal')">✕</button>
      </div>
      <div class="form-group">
        <label>العميل *</label>
        <select id="a_client">
          <option value="">اختر العميل</option>
        </select>
      </div>
      <div class="form-group">
        <label>الفني *</label>
        <select id="a_tech">
          <option value="">اختر الفني</option>
        </select>
      </div>
      <div class="form-group">
        <label>نوع المهمة</label>
        <select id="a_type">
          <option value="maintenance">صيانة</option>
          <option value="installation">تركيب</option>
          <option value="visit">زيارة</option>
        </select>
      </div>
      <div class="form-group">
        <label>تاريخ الزيارة</label>
        <input type="date" id="a_date">
      </div>
      <div class="form-group">
        <label>المبلغ (ج)</label>
        <input type="number" id="a_amount" placeholder="0">
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="hideModal('assignModal')">إلغاء</button>
        <button class="btn btn-primary" onclick="assignTask()">تعيين</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    const session = requireAuth(['admin', 'supervisor']);
    document.getElementById('sidebar').innerHTML = renderSidebar('tasks');

    let currentTab = 'pending';

    function setTab(tab) {
      currentTab = tab;
      ['pending','all','confirmed','assigned'].forEach(t => {
        document.getElementById('tab_' + t).className = t === tab ? 'btn btn-primary btn-sm' : 'btn btn-outline btn-sm';
      });
      renderTasks();
    }

    function renderTasks() {
      const tasks = DB.getTasks();
      const clients = DB.getClients();
      const users = DB.getUsers();
      const isAdmin = session.role === 'admin';

      let filtered = tasks;
      if (currentTab === 'pending') filtered = tasks.filter(t => t.status === 'done_by_tech');
      else if (currentTab === 'confirmed') filtered = tasks.filter(t => t.status === 'confirmed');
      else if (currentTab === 'assigned') filtered = tasks.filter(t => t.status === 'pending');

      filtered = filtered.sort((a, b) => (b.created_at || '').localeCompare(a.created_at || ''));

      const container = document.getElementById('tasksContainer');

      if (!filtered.length) {
        container.innerHTML = `<div class="empty-state"><p>لا توجد مهام في هذا القسم</p></div>`;
        return;
      }

      const statusMap = { pending: 'معلق', done_by_tech: 'بانتظار موافقة', confirmed: 'مؤكد', rejected: 'مرفوض' };
      const typeMap = { installation: 'تركيب', maintenance: 'صيانة', visit: 'زيارة' };

      container.innerHTML = filtered.map(t => {
        const client = clients.find(c => c.id === t.client_id);
        const tech = users.find(u => u.id === t.technician_id);
        const cardClass = { done_by_tech: 'done', confirmed: 'confirmed', rejected: 'rejected' }[t.status] || '';
        const badgeClass = { pending: 'badge-muted', done_by_tech: 'badge-warning', confirmed: 'badge-success', rejected: 'badge-danger' }[t.status];

        return `<div class="task-card ${cardClass}">
          <div class="task-card-header">
            <div>
              <div class="task-client">${client ? client.name : 'عميل محذوف'}</div>
              <div class="task-meta">
                📞 ${client ? (client.phone || '-') : '-'} &nbsp;|&nbsp;
                📍 ${client ? (client.address || '-') : '-'}
              </div>
              <div class="task-meta" style="margin-top:4px">
                👷 الفني: ${tech ? tech.name : '-'} &nbsp;|&nbsp;
                🔧 ${typeMap[t.type] || t.type} &nbsp;|&nbsp;
                📅 ${formatDate(t.scheduled_date)}
              </div>
              ${isAdmin && t.amount ? `<div class="task-meta" style="color:#34a853;font-weight:700">💰 ${parseFloat(t.amount).toLocaleString('ar-EG')} ج</div>` : ''}
            </div>
            <span class="badge ${badgeClass}">${statusMap[t.status]}</span>
          </div>

          ${t.tech_notes ? `<div style="background:#f8fafc;padding:10px 14px;border-radius:8px;font-size:14px;margin-bottom:8px">📝 ${t.tech_notes}</div>` : ''}
          ${t.image ? `<img src="${t.image}" class="task-image" onclick="previewImage('${t.image}')">` : ''}

          ${t.status === 'done_by_tech' && isAdmin ? `
            <div class="task-actions">
              <button class="btn btn-success btn-sm" onclick="confirmTask(${t.id}, 'confirmed')">✅ تأكيد وإضافة للسيستيم</button>
              <button class="btn btn-danger btn-sm" onclick="confirmTask(${t.id}, 'rejected')">❌ رفض</button>
            </div>` : ''}
        </div>`;
      }).join('');
    }

    function confirmTask(id, action) {
      const msg = action === 'confirmed' ? 'تأكيد هذه الزيارة وإضافتها للسيستيم؟' : 'رفض هذه الزيارة؟';
      if (!confirm(msg)) return;

      const tasks = DB.getTasks();
      const idx = tasks.findIndex(t => t.id === id);
      if (idx === -1) return;

      tasks[idx].status = action;

      if (action === 'confirmed') {
        const clients = DB.getClients();
        const cidx = clients.findIndex(c => c.id === tasks[idx].client_id);
        if (cidx !== -1) {
          const interval = clients[cidx].maintenance_interval_months || 6;
          clients[cidx].next_maintenance = addMonths(new Date().toISOString().split('T')[0], interval);
          DB.setClients(clients);
        }

        // deduct parts from inventory
        const partsUsed = tasks[idx].parts_used || [];
        if (partsUsed.length) {
          const inv = DB.getInventory();
          partsUsed.forEach(p => {
            const ii = inv.findIndex(i => i.id === p.inventoryId);
            if (ii !== -1) inv[ii].quantity = Math.max(0, inv[ii].quantity - p.quantity);
          });
          DB.setInventory(inv);
        }

        // save maintenance log
        const logs = DB.getMaintenanceLogs();
        logs.push({
          id: genId(),
          task_id: tasks[idx].id,
          client_id: tasks[idx].client_id,
          technician_id: tasks[idx].technician_id,
          notes: tasks[idx].tech_notes || '',
          image: tasks[idx].image || null,
          parts_used: partsUsed,
          amount: tasks[idx].amount || 0,
          visit_date: tasks[idx].completed_date || new Date().toISOString(),
          created_at: new Date().toISOString(),
        });
        DB.setMaintenanceLogs(logs);

        toast('تم التأكيد وتحديث موعد الصيانة القادم', 'success');
      } else {
        toast('تم الرفض', 'error');
      }

      DB.setTasks(tasks);
      renderTasks();
    }

    function openAssignModal() {
      const clients = DB.getClients();
      const users = DB.getUsers().filter(u => u.role === 'technician');

      document.getElementById('a_client').innerHTML = '<option value="">اختر العميل</option>' +
        clients.map(c => `<option value="${c.id}">${c.name} - ${c.phone || ''}</option>`).join('');

      document.getElementById('a_tech').innerHTML = '<option value="">اختر الفني</option>' +
        users.map(u => `<option value="${u.id}">${u.name}</option>`).join('');

      document.getElementById('a_date').value = new Date().toISOString().split('T')[0];
      document.getElementById('a_amount').value = '';
      showModal('assignModal');
    }

    function assignTask() {
      const client_id = parseInt(document.getElementById('a_client').value);
      const tech_id = parseInt(document.getElementById('a_tech').value);
      const type = document.getElementById('a_type').value;
      const date = document.getElementById('a_date').value;
      const amount = parseFloat(document.getElementById('a_amount').value) || 0;

      if (!client_id || !tech_id) { toast('اختر العميل والفني', 'error'); return; }

      const tasks = DB.getTasks();
      tasks.push({
        id: genId(),
        client_id, technician_id: tech_id,
        assigned_by: session.id,
        type, status: 'pending',
        scheduled_date: date,
        amount,
        created_at: new Date().toISOString()
      });
      DB.setTasks(tasks);
      toast('تم تعيين المهمة للفني', 'success');
      hideModal('assignModal');
      renderTasks();
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('overlayBg').classList.toggle('show');
    }

    renderTasks();
  </script>
</body>
</html>
