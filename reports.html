<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نيو لايف - التقارير</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .report-grid { display:grid; grid-template-columns:1fr 1fr; gap:24px; }
    @media(max-width:768px){ .report-grid { grid-template-columns:1fr; } }
    .bar-chart { display:flex; flex-direction:column; gap:10px; }
    .bar-row { display:flex; align-items:center; gap:12px; }
    .bar-label { width:120px; font-size:13px; font-weight:600; text-align:right; flex-shrink:0; }
    .bar-track { flex:1; background:#f1f5f9; border-radius:8px; height:28px; overflow:hidden; }
    .bar-fill { height:100%; border-radius:8px; display:flex; align-items:center; padding-right:10px; font-size:12px; font-weight:700; color:white; transition:width 0.6s ease; min-width:30px; }
    .bar-value { width:70px; font-size:13px; font-weight:700; text-align:left; flex-shrink:0; }
    .month-tabs { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:20px; }
  </style>
</head>
<body>
  <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
  <div class="overlay-bg" id="overlayBg" onclick="toggleSidebar()"></div>

  <div class="layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="main-content">
      <div class="page-header">
        <div>
          <div class="page-title">التقارير</div>
          <div class="page-subtitle">إيرادات وأداء الفنيين</div>
        </div>
      </div>

      <!-- Summary cards -->
      <div class="stats-grid" id="reportStats"></div>

      <div class="month-tabs" id="monthTabs"></div>

      <div class="report-grid">
        <!-- Revenue by month -->
        <div class="card">
          <div class="card-header"><div class="card-title">💰 الإيرادات الشهرية (آخر 6 أشهر)</div></div>
          <div class="bar-chart" id="revenueChart"></div>
        </div>

        <!-- Technician performance -->
        <div class="card">
          <div class="card-header"><div class="card-title">👷 أداء الفنيين</div></div>
          <div class="bar-chart" id="techChart"></div>
        </div>

        <!-- Maintenance by type -->
        <div class="card">
          <div class="card-header"><div class="card-title">🔧 الزيارات حسب النوع</div></div>
          <div class="bar-chart" id="typeChart"></div>
        </div>

        <!-- Top clients -->
        <div class="card">
          <div class="card-header"><div class="card-title">⭐ أكثر العملاء زيارات</div></div>
          <div class="bar-chart" id="clientChart"></div>
        </div>
      </div>

      <!-- Detailed table -->
      <div class="card" id="detailCard" style="display:none">
        <div class="card-header">
          <div class="card-title" id="detailTitle">تفاصيل الشهر</div>
          <button class="btn btn-sm btn-outline" onclick="document.getElementById('detailCard').style.display='none'">إغلاق</button>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>العميل</th><th>الفني</th><th>التاريخ</th><th>المبلغ</th><th>ملاحظات</th></tr></thead>
            <tbody id="detailTable"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    const session = requireAuth(['admin']);
    document.getElementById('sidebar').innerHTML = renderSidebar('reports');

    function getMonthLabel(dateStr) {
      const d = new Date(dateStr);
      return d.toLocaleDateString('ar-EG', { year: 'numeric', month: 'long' });
    }

    function getMonthKey(dateStr) {
      const d = new Date(dateStr);
      return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    }

    function renderBar(value, max, color) {
      const pct = max > 0 ? Math.max(4, Math.round((value / max) * 100)) : 4;
      return `<div class="bar-fill" style="width:${pct}%;background:${color}">${value > 0 ? '' : ''}</div>`;
    }

    function renderReports() {
      const logs = DB.getMaintenanceLogs();
      const clients = DB.getClients();
      const users = DB.getUsers();
      const tasks = DB.getTasks();

      // ── Summary ──
      const totalRevenue = logs.reduce((s, l) => s + (parseFloat(l.amount)||0), 0);
      const thisMonth = getMonthKey(new Date().toISOString());
      const monthRevenue = logs.filter(l => getMonthKey(l.visit_date||'') === thisMonth)
                               .reduce((s, l) => s + (parseFloat(l.amount)||0), 0);
      const confirmedTasks = tasks.filter(t => t.status === 'confirmed').length;

      document.getElementById('reportStats').innerHTML = `
        <div class="stat-card"><div class="stat-icon purple">💰</div>
          <div><div class="stat-value">${totalRevenue.toLocaleString('ar-EG')} ج</div><div class="stat-label">إجمالي الإيرادات</div></div></div>
        <div class="stat-card"><div class="stat-icon green">📅</div>
          <div><div class="stat-value">${monthRevenue.toLocaleString('ar-EG')} ج</div><div class="stat-label">إيرادات هذا الشهر</div></div></div>
        <div class="stat-card"><div class="stat-icon blue">✅</div>
          <div><div class="stat-value">${confirmedTasks}</div><div class="stat-label">زيارات مؤكدة</div></div></div>
        <div class="stat-card"><div class="stat-icon orange">👥</div>
          <div><div class="stat-value">${clients.length}</div><div class="stat-label">إجمالي العملاء</div></div></div>
      `;

      // ── Revenue by month (last 6) ──
      const monthMap = {};
      for (let i = 5; i >= 0; i--) {
        const d = new Date(); d.setMonth(d.getMonth() - i);
        const key = getMonthKey(d.toISOString());
        monthMap[key] = { label: d.toLocaleDateString('ar-EG', { month: 'short', year: '2-digit' }), revenue: 0, count: 0 };
      }
      logs.forEach(l => {
        const key = getMonthKey(l.visit_date || '');
        if (monthMap[key]) {
          monthMap[key].revenue += parseFloat(l.amount) || 0;
          monthMap[key].count++;
        }
      });
      const maxRev = Math.max(...Object.values(monthMap).map(m => m.revenue), 1);
      document.getElementById('revenueChart').innerHTML = Object.entries(monthMap).map(([key, m]) => `
        <div class="bar-row" style="cursor:pointer" onclick="showDetail('${key}')">
          <div class="bar-label">${m.label}</div>
          <div class="bar-track">${renderBar(m.revenue, maxRev, '#1a73e8')}</div>
          <div class="bar-value">${m.revenue.toLocaleString('ar-EG')} ج</div>
        </div>`).join('');

      // ── Technician performance ──
      const techMap = {};
      users.filter(u => u.role === 'technician').forEach(u => { techMap[u.id] = { name: u.name, count: 0, revenue: 0 }; });
      logs.forEach(l => {
        if (techMap[l.technician_id]) {
          techMap[l.technician_id].count++;
          techMap[l.technician_id].revenue += parseFloat(l.amount) || 0;
        }
      });
      const techArr = Object.values(techMap).sort((a, b) => b.count - a.count);
      const maxCount = Math.max(...techArr.map(t => t.count), 1);
      document.getElementById('techChart').innerHTML = techArr.length
        ? techArr.map(t => `
          <div class="bar-row">
            <div class="bar-label">${t.name}</div>
            <div class="bar-track">${renderBar(t.count, maxCount, '#34a853')}</div>
            <div class="bar-value">${t.count} زيارة</div>
          </div>`).join('')
        : '<p style="color:#64748b;text-align:center;padding:20px">لا توجد بيانات</p>';

      // ── By type ──
      const typeMap2 = { installation: { label: 'تركيب', count: 0 }, maintenance: { label: 'صيانة', count: 0 }, visit: { label: 'زيارة', count: 0 } };
      tasks.filter(t => t.status === 'confirmed').forEach(t => { if (typeMap2[t.type]) typeMap2[t.type].count++; });
      const maxType = Math.max(...Object.values(typeMap2).map(t => t.count), 1);
      document.getElementById('typeChart').innerHTML = Object.values(typeMap2).map(t => `
        <div class="bar-row">
          <div class="bar-label">${t.label}</div>
          <div class="bar-track">${renderBar(t.count, maxType, '#f59e0b')}</div>
          <div class="bar-value">${t.count}</div>
        </div>`).join('');

      // ── Top clients ──
      const clientVisits = {};
      logs.forEach(l => { clientVisits[l.client_id] = (clientVisits[l.client_id] || 0) + 1; });
      const topClients = Object.entries(clientVisits)
        .sort((a, b) => b[1] - a[1]).slice(0, 6)
        .map(([id, count]) => ({ name: clients.find(c => c.id === id)?.name || 'عميل', count }));
      const maxC = Math.max(...topClients.map(c => c.count), 1);
      document.getElementById('clientChart').innerHTML = topClients.length
        ? topClients.map(c => `
          <div class="bar-row">
            <div class="bar-label">${c.name}</div>
            <div class="bar-track">${renderBar(c.count, maxC, '#8b5cf6')}</div>
            <div class="bar-value">${c.count} زيارة</div>
          </div>`).join('')
        : '<p style="color:#64748b;text-align:center;padding:20px">لا توجد بيانات</p>';
    }

    function showDetail(monthKey) {
      const logs = DB.getMaintenanceLogs().filter(l => getMonthKey(l.visit_date||'') === monthKey);
      const clients = DB.getClients();
      const users = DB.getUsers();
      const d = new Date(monthKey + '-01');
      document.getElementById('detailTitle').textContent = `تفاصيل: ${d.toLocaleDateString('ar-EG', { year:'numeric', month:'long' })}`;
      const total = logs.reduce((s, l) => s + (parseFloat(l.amount)||0), 0);
      document.getElementById('detailTable').innerHTML = logs.length
        ? logs.map(l => {
            const c = clients.find(x => x.id === l.client_id);
            const t = users.find(x => x.id === l.technician_id);
            return `<tr>
              <td>${c?.name||'-'}</td>
              <td>${t?.name||'-'}</td>
              <td>${formatDate(l.visit_date)}</td>
              <td><strong style="color:#16a34a">${(parseFloat(l.amount)||0).toLocaleString('ar-EG')} ج</strong></td>
              <td>${l.notes||'-'}</td>
            </tr>`;
          }).join('') + `<tr style="background:#f8fafc;font-weight:700">
            <td colspan="3">الإجمالي</td>
            <td style="color:#16a34a">${total.toLocaleString('ar-EG')} ج</td>
            <td>${logs.length} زيارة</td>
          </tr>`
        : '<tr><td colspan="5" style="text-align:center;color:#64748b;padding:20px">لا توجد زيارات هذا الشهر</td></tr>';
      document.getElementById('detailCard').style.display = 'block';
      document.getElementById('detailCard').scrollIntoView({ behavior: 'smooth' });
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('overlayBg').classList.toggle('show');
    }

    renderReports();
  </script>
</body>
</html>
