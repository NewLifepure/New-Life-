<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نيو لايف - المستخدمين</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
  <div class="overlay-bg" id="overlayBg" onclick="toggleSidebar()"></div>

  <div class="layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="main-content">
      <div class="page-header">
        <div><div class="page-title">إدارة المستخدمين</div></div>
        <button class="btn btn-primary" onclick="openAddModal()">+ إضافة مستخدم</button>
      </div>

      <div class="card">
        <div class="table-wrap">
          <table>
            <thead><tr><th>#</th><th>الاسم</th><th>اسم المستخدم</th><th>الدور</th><th>إجراءات</th></tr></thead>
            <tbody id="usersTable"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="userModal" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">إضافة مستخدم</div>
        <button class="modal-close" onclick="hideModal('userModal')">✕</button>
      </div>
      <div class="form-group"><label>الاسم *</label><input type="text" id="u_name"></div>
      <div class="form-group"><label>اسم المستخدم *</label><input type="text" id="u_username"></div>
      <div class="form-group"><label>كلمة المرور *</label><input type="password" id="u_password"></div>
      <div class="form-group">
        <label>الدور</label>
        <select id="u_role">
          <option value="technician">فني</option>
          <option value="supervisor">مشرف</option>
          <option value="admin">مدير</option>
        </select>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="hideModal('userModal')">إلغاء</button>
        <button class="btn btn-primary" onclick="saveUser()">حفظ</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    const session = requireAuth(['admin']);
    document.getElementById('sidebar').innerHTML = renderSidebar('users');

    let editingId = null;

    function renderUsers() {
      const users = DB.getUsers();
      const roleMap = { admin: 'مدير', supervisor: 'مشرف', technician: 'فني' };
      const badgeMap = { admin: 'badge-danger', supervisor: 'badge-warning', technician: 'badge-info' };
      document.getElementById('usersTable').innerHTML = users.map((u, i) => `
        <tr>
          <td>${i+1}</td>
          <td><strong>${u.name}</strong></td>
          <td>${u.username}</td>
          <td><span class="badge ${badgeMap[u.role]}">${roleMap[u.role]}</span></td>
          <td>
            <button class="btn btn-sm btn-primary" onclick="openEditModal(${u.id})">تعديل</button>
            ${u.id !== session.id ? `<button class="btn btn-sm btn-danger" onclick="deleteUser(${u.id})">حذف</button>` : ''}
          </td>
        </tr>
      `).join('');
    }

    function openAddModal() {
      editingId = null;
      document.getElementById('modalTitle').textContent = 'إضافة مستخدم';
      ['u_name','u_username','u_password'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('u_role').value = 'technician';
      showModal('userModal');
    }

    function openEditModal(id) {
      const u = DB.getUsers().find(x => x.id === id);
      editingId = id;
      document.getElementById('modalTitle').textContent = 'تعديل مستخدم';
      document.getElementById('u_name').value = u.name;
      document.getElementById('u_username').value = u.username;
      document.getElementById('u_password').value = '';
      document.getElementById('u_role').value = u.role;
      showModal('userModal');
    }

    function saveUser() {
      const name = document.getElementById('u_name').value.trim();
      const username = document.getElementById('u_username').value.trim();
      const password = document.getElementById('u_password').value.trim();
      const role = document.getElementById('u_role').value;
      if (!name || !username) { toast('الاسم واسم المستخدم مطلوبان', 'error'); return; }

      const users = DB.getUsers();
      if (editingId) {
        const idx = users.findIndex(u => u.id === editingId);
        users[idx] = { ...users[idx], name, username, role, ...(password ? { password } : {}) };
        toast('تم التحديث', 'success');
      } else {
        if (!password) { toast('كلمة المرور مطلوبة', 'error'); return; }
        if (users.find(u => u.username === username)) { toast('اسم المستخدم موجود بالفعل', 'error'); return; }
        users.push({ id: genId(), name, username, password, role });
        toast('تم إضافة المستخدم', 'success');
      }
      DB.setUsers(users);
      hideModal('userModal');
      renderUsers();
    }

    function deleteUser(id) {
      if (!confirm('حذف هذا المستخدم؟')) return;
      DB.setUsers(DB.getUsers().filter(u => u.id !== id));
      toast('تم الحذف', 'success');
      renderUsers();
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('overlayBg').classList.toggle('show');
    }

    renderUsers();
  </script>
</body>
</html>
