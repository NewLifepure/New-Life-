<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نيو لايف - تسجيل الدخول</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="login-page">
    <div class="login-box">
      <div class="login-logo">
        <img src="https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=200&h=200&fit=crop" alt="نيو لايف">
        <h1>نيو لايف</h1>
        <p>نظام إدارة الفلاتر والصيانة</p>
      </div>

      <div class="form-group">
        <label>اسم المستخدم</label>
        <input type="text" id="username" placeholder="أدخل اسم المستخدم">
      </div>
      <div class="form-group">
        <label>كلمة المرور</label>
        <input type="password" id="password" placeholder="أدخل كلمة المرور" onkeydown="if(event.key==='Enter') doLogin()">
      </div>
      <div id="error" style="color:#ea4335;font-size:14px;margin-bottom:12px;display:none;">بيانات خاطئة، حاول مرة أخرى</div>
      <button class="btn btn-primary btn-full" onclick="doLogin()">دخول</button>

      <div style="margin-top:24px;padding-top:20px;border-top:1px solid #e2e8f0;font-size:13px;color:#64748b;">
        <strong>بيانات تجريبية:</strong><br>
        مدير: admin / admin123<br>
        مشرف: supervisor / super123<br>
        فني: tech1 / tech123
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    // redirect if already logged in
    const s = DB.getSession();
    if (s) {
      if (s.role === 'technician') window.location.href = 'technician.html';
      else window.location.href = 'dashboard.html';
    }

    function doLogin() {
      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value.trim();
      const user = login(u, p);
      if (!user) {
        document.getElementById('error').style.display = 'block';
        return;
      }
      if (user.role === 'technician') window.location.href = 'technician.html';
      else window.location.href = 'dashboard.html';
    }
  </script>
</body>
</html>
