<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نيو لايف - سجلات الصيانة</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
  <div class="overlay-bg" id="overlayBg" onclick="toggleSidebar()"></div>

  <div class="layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="main-content">
      <div class="page-header">
        <div>
          <div class="page-title">سجلات الصيانة</div>
          <div class="page-subtitle">جميع الزيارات المؤكدة</div>
        </div>
        <button class="btn btn-outline btn-sm" onclick="exportLogs()">📥 تصدير</button>
      </div>

      <div class="card">
        <div class="search-bar">
          <input type="text" id="searchInput" placeholder="🔍 بحث بالعميل أو الفني..." oninput="renderLogs()">
          <select id="filterMonth" onchange="renderLogs()" style="padding:10px 14px;border:2px solid #e2e8f0;border-radius:10px;font-family:Cairo,sans-serif">
            <option value="">كل الأوقات</option>
            <option value="this_month">هذا الشهر</option>
            <option value="last_month">الشهر الماضي</option>
          </select>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>العميل</th>
                <th>الفني</th>
                <th>نوع الزيارة</th>
                <th>تاريخ الزيارة</th>
                <th>المبلغ</th>
                <th>القطع المستخدمة</th>
                <th>صورة</th>
                <th>ملاحظات</th>
              </tr>
            </thead>
            <tbody id="logsTable"></tbody>
          </table>
        </div>
        <div id="totalRow" style="padding:16px;font-weight:700;font-size:16px;border-top:2px solid #e2e8f0;text-align:left"></div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    const session = requireAuth(['admin', 'supervisor']);
    document.getElementById('sidebar').innerHTML = renderSidebar('maintenance');

    function renderLogs() {
      const logs = DB.getMaintenanceLogs();
      const clients = DB.getClients();
      const users = DB.getUsers();
      const inv = DB.getInventory();
      const tasks = DB.getTasks();
      const q = document.getElementById('searchInput').value.toLowerCase();
      const filterMonth = document.getElementById('filterMonth').value;

      const now = new Date();
      const thisMonthStart = new Date(now.getFullYear(), now.getMonth(), 1).toISOString().split('T')[0];
      const thisMonthEnd = new Date(now.getFullYear(), now.getMonth() + 1, 0).toISOString().split('T')[0];
      const lastMonthStart = new Date(now.getFullYear(), now.getMonth() - 1, 1).toISOString().split('T')[0];
      const lastMonthEnd = new Date(now.getFullYear(), now.getMonth(), 0).toISOString().split('T')[0];

      let filtered = logs.filter(log => {
        const client = clients.find(c => c.id === log.client_id);
        const tech = users.find(u => u.id === log.technician_id);
        const matchQ = !q ||
          (client && client.name.toLowerCase().includes(q)) ||
          (tech && tech.name.toLowerCase().includes(q));
        if (!matchQ) return false;
        const d = (log.visit_date || '').split('T')[0];
        if (filterMonth === 'this_month') return d >= thisMonthStart && d <= thisMonthEnd;
        if (filterMonth === 'last_month') return d >= lastMonthStart && d <= lastMonthEnd;
        return true;
      }).sort((a, b) => (b.visit_date || '').localeCompare(a.visit_date || ''));

      const totalAmount = filtered.reduce((s, l) => s + (parseFloat(l.amount) || 0), 0);

      const tbody = document.getElementById('logsTable');
      if (!filtered.length) {
        tbody.innerHTML = '<tr><td colspan="9" style="text-align:center;padding:40px;color:#64748b">لا توجد سجلات</td></tr>';
        document.getElementById('totalRow').textContent = '';
        return;
      }

      tbody.innerHTML = filtered.map((log, i) => {
        const client = clients.find(c => c.id === log.client_id);
        const tech = users.find(u => u.id === log.technician_id);
        const task = tasks.find(t => t.id === log.task_id);
        const typeMap = { installation: 'تركيب', maintenance: 'صيانة', visit: 'زيارة' };
        const partsHTML = (log.parts_used || []).map(p => {
          const item = inv.find(i => i.id === p.inventoryId);
          return item ? `<span class="badge badge-info" style="margin:2px">${item.name} ×${p.quantity}</span>` : '';
        }).join('') || '-';

        return `<tr>
          <td>${i + 1}</td>
          <td><strong>${client ? client.name : '-'}</strong><br><small style="color:#64748b">${client ? (client.phone || '') : ''}</small></td>
          <td>${tech ? tech.name : '-'}</td>
          <td>${typeMap[task?.type] || 'زيارة'}</td>
          <td>${formatDate(log.visit_date)}</td>
          <td>${session.role === 'admin' ? `<strong style="color:#16a34a">${(parseFloat(log.amount)||0).toLocaleString('ar-EG')} ج</strong>` : '—'}</td>
          <td style="max-width:200px">${partsHTML}</td>
          <td>${log.image ? `<img src="${log.image}" style="width:60px;height:60px;object-fit:cover;border-radius:8px;cursor:pointer" onclick="previewImage('${log.image}')">` : '-'}</td>
          <td style="max-width:150px;font-size:13px">${log.notes || '-'}</td>
        </tr>`;
      }).join('');

      document.getElementById('totalRow').innerHTML = session.role === 'admin'
        ? `إجمالي الإيرادات: <span style="color:#16a34a">${totalAmount.toLocaleString('ar-EG')} ج</span> | عدد الزيارات: ${filtered.length}`
        : `عدد الزيارات: ${filtered.length}`;
    }

    function exportLogs() {
      const logs = DB.getMaintenanceLogs();
      const clients = DB.getClients();
      const users = DB.getUsers();
      const rows = [['العميل','الهاتف','الفني','تاريخ الزيارة','المبلغ','ملاحظات']];
      logs.forEach(log => {
        const c = clients.find(x => x.id === log.client_id);
        const t = users.find(x => x.id === log.technician_id);
        rows.push([c?.name||'', c?.phone||'', t?.name||'', (log.visit_date||'').split('T')[0], log.amount||0, log.notes||'']);
      });
      const csv = '\uFEFF' + rows.map(r => r.map(v => `"${v}"`).join(',')).join('\n');
      const a = document.createElement('a');
      a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
      a.download = 'maintenance_logs.csv';
      a.click();
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('overlayBg').classList.toggle('show');
    }

    renderLogs();
  </script>
</body>
</html>
