<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نيو لايف - الرئيسية</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
  <div class="overlay-bg" id="overlayBg" onclick="toggleSidebar()"></div>

  <div class="layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="main-content">
      <div class="page-header">
        <div>
          <div class="page-title">لوحة التحكم</div>
          <div class="page-subtitle" id="dateLabel"></div>
        </div>
      </div>

      <!-- Stats -->
      <div class="stats-grid" id="statsGrid"></div>

      <!-- Charts row -->
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px;" id="chartsRow">
        <div class="card">
          <div class="card-header"><div class="card-title">صيانات هذا الشهر</div></div>
          <div id="monthChart"></div>
        </div>
        <div class="card">
          <div class="card-header"><div class="card-title">آخر المهام المنتظرة موافقة</div></div>
          <div id="pendingList"></div>
        </div>
      </div>

      <!-- Upcoming maintenance -->
      <div class="card">
        <div class="card-header">
          <div class="card-title">عملاء موعد صيانتهم قريب (خلال 30 يوم)</div>
        </div>
        <div class="table-wrap">
          <table>
            <thead><tr><th>الاسم</th><th>الهاتف</th><th>موعد الصيانة</th><th>العنوان</th></tr></thead>
            <tbody id="upcomingTable"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    const session = requireAuth(['admin', 'supervisor']);
    document.getElementById('sidebar').innerHTML = renderSidebar('dashboard');
    document.getElementById('dateLabel').textContent = new Date().toLocaleDateString('ar-EG', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

    function loadDashboard() {
      const clients = DB.getClients();
      const tasks = DB.getTasks();
      const today = new Date();
      const todayStr = today.toISOString().split('T')[0];

      // Month range
      const monthStart = new Date(today.getFullYear(), today.getMonth(), 1).toISOString().split('T')[0];
      const monthEnd = new Date(today.getFullYear(), today.getMonth() + 1, 0).toISOString().split('T')[0];

      // Week range
      const weekAgo = new Date(today); weekAgo.setDate(today.getDate() - 7);
      const weekStart = weekAgo.toISOString().split('T')[0];

      const totalClients = clients.length;
      const maintenanceMonth = clients.filter(c => c.next_maintenance >= monthStart && c.next_maintenance <= monthEnd).length;
      const maintenanceWeek = clients.filter(c => c.next_maintenance >= weekStart && c.next_maintenance <= todayStr).length;
      const pendingTasks = tasks.filter(t => t.status === 'done_by_tech').length;

      // Revenue (admin only)
      const totalRevenue = clients.reduce((s, c) => s + (parseFloat(c.amount_paid) || 0), 0);
      const tasksRevenue = tasks.filter(t => t.status === 'confirmed').reduce((s, t) => s + (parseFloat(t.amount) || 0), 0);

      const isAdmin = session.role === 'admin';

      // Alert counts
      const redAlerts = clients.filter(c => getClientStatus(c.next_maintenance) === 'overdue').length;
      const yellowAlerts = clients.filter(c => getClientStatus(c.next_maintenance) === 'upcoming').length;
      const invAlerts = getInventoryAlerts().length;

      document.getElementById('statsGrid').innerHTML = `
        <div class="stat-card">
          <div class="stat-icon blue">👥</div>
          <div><div class="stat-value">${totalClients}</div><div class="stat-label">إجمالي العملاء</div></div>
        </div>
        <div class="stat-card" style="cursor:pointer" onclick="window.location='clients.html'">
          <div class="stat-icon red">🔴</div>
          <div><div class="stat-value">${redAlerts}</div><div class="stat-label">صيانة متأخرة</div></div>
        </div>
        <div class="stat-card" style="cursor:pointer" onclick="window.location='clients.html'">
          <div class="stat-icon orange">🟡</div>
          <div><div class="stat-value">${yellowAlerts}</div><div class="stat-label">صيانة خلال 14 يوم</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon orange">🔧</div>
          <div><div class="stat-value">${maintenanceMonth}</div><div class="stat-label">صيانات هذا الشهر</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon red">⏳</div>
          <div><div class="stat-value">${pendingTasks}</div><div class="stat-label">مهام تنتظر موافقة</div></div>
        </div>
        ${invAlerts > 0 ? `<div class="stat-card" style="cursor:pointer" onclick="window.location='inventory.html'">
          <div class="stat-icon red">📦</div>
          <div><div class="stat-value">${invAlerts}</div><div class="stat-label">تنبيهات المخزون</div></div>
        </div>` : ''}
        ${isAdmin ? `
        <div class="stat-card">
          <div class="stat-icon purple">💰</div>
          <div><div class="stat-value">${totalRevenue.toLocaleString('ar-EG')} ج</div><div class="stat-label">إجمالي المبالغ</div></div>
        </div>
        <div class="stat-card">
          <div class="stat-icon green">✅</div>
          <div><div class="stat-value">${tasksRevenue.toLocaleString('ar-EG')} ج</div><div class="stat-label">إيرادات الزيارات</div></div>
        </div>` : ''}
      `;

      // Pending tasks list
      const pending = tasks.filter(t => t.status === 'done_by_tech').slice(0, 5);
      const users = DB.getUsers();
      document.getElementById('pendingList').innerHTML = pending.length ? pending.map(t => {
        const client = clients.find(c => c.id === t.client_id);
        const tech = users.find(u => u.id === t.technician_id);
        return `<div style="padding:12px 0;border-bottom:1px solid #e2e8f0;">
          <div style="font-weight:700">${client ? client.name : 'عميل محذوف'}</div>
          <div style="font-size:13px;color:#64748b;">الفني: ${tech ? tech.name : '-'} | ${formatDate(t.completed_date)}</div>
          ${isAdmin ? `<a href="tasks.html" style="font-size:13px;color:#1a73e8;">مراجعة ←</a>` : ''}
        </div>`;
      }).join('') : '<p style="color:#64748b;padding:20px 0;text-align:center;">لا توجد مهام منتظرة</p>';

      // Upcoming maintenance
      const in30 = new Date(today); in30.setDate(today.getDate() + 30);
      const upcoming = clients
        .filter(c => c.next_maintenance && c.next_maintenance >= todayStr && c.next_maintenance <= in30.toISOString().split('T')[0])
        .sort((a, b) => a.next_maintenance.localeCompare(b.next_maintenance));

      document.getElementById('upcomingTable').innerHTML = upcoming.length
        ? upcoming.map(c => `<tr>
            <td><strong>${c.name}</strong></td>
            <td>${c.phone || '-'}</td>
            <td><span class="badge badge-warning">${formatDate(c.next_maintenance)}</span></td>
            <td>${c.address || '-'}</td>
          </tr>`).join('')
        : '<tr><td colspan="4" style="text-align:center;color:#64748b;padding:30px">لا يوجد مواعيد قريبة</td></tr>';
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('overlayBg').classList.toggle('show');
    }

    loadDashboard();
  </script>
</body>
</html>
