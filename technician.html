<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نيو لايف - مهامي</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="main-content">
      <div class="page-header">
        <div>
          <div class="page-title">مهامي</div>
          <div class="page-subtitle" id="techName"></div>
        </div>
      </div>

      <div id="tasksContainer"></div>
    </div>
  </div>

  <!-- Complete Task Modal -->
  <div class="modal-overlay" id="completeModal" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title">تسجيل إتمام الزيارة</div>
        <button class="modal-close" onclick="hideModal('completeModal')">✕</button>
      </div>
      <div id="taskInfo" style="background:#f8fafc;padding:14px;border-radius:10px;margin-bottom:20px;font-size:14px"></div>
      <div class="form-group">
        <label>ملاحظات الزيارة</label>
        <textarea id="c_notes" rows="3" placeholder="اكتب ما تم عمله..."></textarea>
      </div>
      <div class="form-group">
        <label>القطع المستخدمة (اختياري)</label>
        <div id="partsContainer"></div>
        <button type="button" class="btn btn-outline btn-sm" style="margin-top:8px" onclick="addPartRow()">+ إضافة قطعة</button>
      </div>
      <div class="form-group">
        <label>صورة الصيانة / التركيب *</label>
        <input type="file" id="c_image" accept="image/*" capture="environment">
        <div id="imagePreviewWrap" style="margin-top:10px"></div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="hideModal('completeModal')">إلغاء</button>
        <button class="btn btn-success" onclick="submitTask()">إرسال للمدير</button>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
  <script>
    const session = requireAuth(['technician']);
    document.getElementById('sidebar').innerHTML = renderSidebar('tech');
    document.getElementById('techName').textContent = 'مرحباً ' + session.name;

    let currentTaskId = null;

    function addPartRow() {
      const inv = DB.getInventory();
      if (!inv.length) { toast('لا يوجد مخزون مسجل', 'error'); return; }
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;gap:8px;margin-bottom:8px;align-items:center';
      row.innerHTML = `
        <select style="flex:1;padding:8px;border:2px solid #e2e8f0;border-radius:8px;font-family:Cairo,sans-serif">
          ${inv.map(i => `<option value="${i.id}">${i.name} (متاح: ${i.quantity})</option>`).join('')}
        </select>
        <input type="number" min="1" value="1" style="width:70px;padding:8px;border:2px solid #e2e8f0;border-radius:8px;font-family:Cairo,sans-serif">
        <button type="button" onclick="this.parentElement.remove()" style="background:#fee2e2;border:none;border-radius:8px;padding:8px 12px;cursor:pointer;color:#991b1b">✕</button>
      `;
      document.getElementById('partsContainer').appendChild(row);
    }

    function renderTasks() {
      const tasks = DB.getTasks().filter(t => t.technician_id === session.id);
      const clients = DB.getClients();
      const container = document.getElementById('tasksContainer');

      const pending = tasks.filter(t => t.status === 'pending');
      const done = tasks.filter(t => t.status !== 'pending');

      if (!tasks.length) {
        container.innerHTML = `<div class="empty-state"><p>لا توجد مهام معينة لك حالياً</p></div>`;
        return;
      }

      const typeMap = { installation: 'تركيب', maintenance: 'صيانة', visit: 'زيارة' };
      const statusMap = { pending: 'معلق', done_by_tech: 'بانتظار موافقة المدير', confirmed: 'مؤكد ✅', rejected: 'مرفوض ❌' };
      const badgeMap = { pending: 'badge-info', done_by_tech: 'badge-warning', confirmed: 'badge-success', rejected: 'badge-danger' };

      let html = '';

      if (pending.length) {
        html += `<div style="font-size:18px;font-weight:700;margin-bottom:16px">📋 المهام المطلوبة منك (${pending.length})</div>`;
        html += pending.map(t => {
          const client = clients.find(c => c.id === t.client_id);
          return `<div class="task-card">
            <div class="task-card-header">
              <div>
                <div class="task-client">${client ? client.name : 'عميل'}</div>
                <div class="task-meta">📞 ${client ? (client.phone || '-') : '-'}</div>
                <div class="task-meta">📍 ${client ? (client.address || '-') : '-'}</div>
                <div class="task-meta">🔧 ${typeMap[t.type]} &nbsp;|&nbsp; 📅 ${formatDate(t.scheduled_date)}</div>
              </div>
              <span class="badge badge-info">جديدة</span>
            </div>
            <div class="task-actions">
              <button class="btn btn-success" onclick="openCompleteModal(${t.id})">📸 تسجيل الإتمام</button>
            </div>
          </div>`;
        }).join('');
      }

      if (done.length) {
        html += `<div style="font-size:18px;font-weight:700;margin:24px 0 16px">📁 المهام السابقة</div>`;
        html += done.map(t => {
          const client = clients.find(c => c.id === t.client_id);
          return `<div class="task-card ${t.status === 'confirmed' ? 'confirmed' : t.status === 'rejected' ? 'rejected' : 'done'}">
            <div class="task-card-header">
              <div>
                <div class="task-client">${client ? client.name : 'عميل'}</div>
                <div class="task-meta">🔧 ${typeMap[t.type]} &nbsp;|&nbsp; 📅 ${formatDate(t.completed_date || t.scheduled_date)}</div>
              </div>
              <span class="badge ${badgeMap[t.status]}">${statusMap[t.status]}</span>
            </div>
            ${t.tech_notes ? `<div style="font-size:13px;color:#64748b">${t.tech_notes}</div>` : ''}
            ${t.image ? `<img src="${t.image}" class="task-image" onclick="previewImage('${t.image}')">` : ''}
          </div>`;
        }).join('');
      }

      container.innerHTML = html;
    }

    function openCompleteModal(taskId) {
      currentTaskId = taskId;
      const task = DB.getTasks().find(t => t.id === taskId);
      const client = DB.getClients().find(c => c.id === task.client_id);
      const typeMap = { installation: 'تركيب', maintenance: 'صيانة', visit: 'زيارة' };

      document.getElementById('taskInfo').innerHTML = `
        <strong>${client ? client.name : 'عميل'}</strong><br>
        📞 ${client ? (client.phone || '-') : '-'}<br>
        📍 ${client ? (client.address || '-') : '-'}<br>
        🔧 ${typeMap[task.type]} | 📅 ${formatDate(task.scheduled_date)}
      `;
      document.getElementById('c_notes').value = '';
      document.getElementById('c_image').value = '';
      document.getElementById('imagePreviewWrap').innerHTML = '';
      document.getElementById('partsContainer').innerHTML = '';
      showModal('completeModal');
    }

    document.getElementById('c_image').addEventListener('change', function() {
      const file = this.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        document.getElementById('imagePreviewWrap').innerHTML =
          `<img src="${e.target.result}" style="width:100%;max-height:200px;object-fit:cover;border-radius:10px">`;
      };
      reader.readAsDataURL(file);
    });

    async function submitTask() {
      const imageFile = document.getElementById('c_image').files[0];
      if (!imageFile) { toast('الصورة مطلوبة', 'error'); return; }

      const imageBase64 = await imageToBase64(imageFile);
      const notes = document.getElementById('c_notes').value.trim();

      // collect parts used
      const partRows = document.getElementById('partsContainer').querySelectorAll('div');
      const partsUsed = [];
      partRows.forEach(row => {
        const sel = row.querySelector('select');
        const qty = row.querySelector('input[type=number]');
        if (sel && qty) partsUsed.push({ inventoryId: sel.value, quantity: parseInt(qty.value) || 1 });
      });

      const tasks = DB.getTasks();
      const idx = tasks.findIndex(t => t.id === currentTaskId);
      if (idx === -1) return;

      tasks[idx].status = 'done_by_tech';
      tasks[idx].tech_notes = notes;
      tasks[idx].image = imageBase64;
      tasks[idx].parts_used = partsUsed;
      tasks[idx].completed_date = new Date().toISOString();

      DB.setTasks(tasks);
      toast('تم الإرسال للمدير بنجاح', 'success');
      hideModal('completeModal');
      renderTasks();
    }

    renderTasks();
  </script>
</body>
</html>
