<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نيو لايف - العملاء</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button class="menu-toggle" onclick="toggleSidebar()">☰</button>
  <div class="overlay-bg" id="overlayBg" onclick="toggleSidebar()"></div>

  <div class="layout">
    <div class="sidebar" id="sidebar"></div>
    <div class="main-content">
      <div class="page-header">
        <div>
          <div class="page-title">العملاء</div>
          <div class="page-subtitle" id="countLabel"></div>
        </div>
        <div style="display:flex;gap:10px;">
          <button class="btn btn-outline btn-sm" onclick="exportCSV()">📥 تصدير Excel</button>
          <button class="btn btn-outline btn-sm" onclick="document.getElementById('importFile').click()">📤 استيراد Excel</button>
          <input type="file" id="importFile" accept=".csv" style="display:none" onchange="importCSV(this)">
          <button class="btn btn-primary" onclick="openAddModal()">+ إضافة عميل</button>
        </div>
      </div>

      <div class="card">
        <div class="search-bar">
          <input type="text" id="searchInput" placeholder="🔍 بحث بالاسم أو الهاتف أو العنوان..." oninput="renderTable()">
          <select id="filterMaint" onchange="renderTable()" style="padding:10px 14px;border:2px solid #e2e8f0;border-radius:10px;font-family:Cairo,sans-serif;">
            <option value="">كل العملاء</option>
            <option value="this_month">صيانة هذا الشهر</option>
            <option value="overdue">متأخرة</option>
          </select>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>الاسم</th>
                <th>الهاتف</th>
                <th>العنوان</th>
                <th>تاريخ التركيب</th>
                <th>موعد الصيانة</th>
                <th>المبلغ</th>
                <th>إجراءات</th>
              </tr>
            </thead>
            <tbody id="clientsTable"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Add/Edit Modal -->
  <div class="modal-overlay" id="clientModal" style="display:none">
    <div class="modal">
      <div class="modal-header">
        <div class="modal-title" id="modalTitle">إضافة عميل جديد</div>
        <button class="modal-close" onclick="hideModal('clientModal')">✕</button>
      </div>
      <div class="form-group">
        <label>الاسم *</label>
        <input type="text" id="f_name" placeholder="اسم العميل">
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
        <div class="form-group">
          <label>الهاتف</label>
          <input type="text" id="f_phone" placeholder="01xxxxxxxxx">
        </div>
        <div class="form-group">
          <label>المبلغ المدفوع (ج)</label>
          <input type="number" id="f_amount" placeholder="0">
        </div>
      </div>
      <div class="form-group">
        <label>العنوان</label>
        <input type="text" id="f_address" placeholder="العنوان بالتفصيل">
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
        <div class="form-group">
          <label>تاريخ التركيب</label>
          <input type="date" id="f_install">
        </div>
        <div class="form-group">
          <label>فترة الصيانة (شهر)</label>
          <select id="f_interval">
            <option value="3">كل 3 شهور</option>
            <option value="6" selected>كل 6 شهور</option>
            <option value="12">كل سنة</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label>موعد الصيانة القادم</label>
        <input type="date" id="f_next_maint">
      </div>
      <div class="form-group">
        <label>ملاحظات</label>
        <textarea id="f_notes" rows="3" placeholder="أي ملاحظات..."></textarea>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="hideModal('clientModal')">إلغاء</button>
        <button class="btn btn-primary" onclick="saveClient()">حفظ</button>
      </div>
    </div>
  </div>

  <!-- View Modal -->
  <div class="modal-overlay" id="viewModal" style="display:none">
    <div class="modal" style="max-width:620px">
      <div class="modal-header">
        <div class="modal-title">تفاصيل العميل</div>
        <button class="modal-close" onclick="hideModal('viewModal')">✕</button>
      </div>
      <div id="viewContent"></div>
    </div>
  </div>

  <script src="app.js"></script>
  <script>
    const session = requireAuth(['admin', 'supervisor']);
    document.getElementById('sidebar').innerHTML = renderSidebar('clients');

    let editingId = null;

    function renderTable() {
      const clients = DB.getClients();
      const q = document.getElementById('searchInput').value.toLowerCase();
      const filter = document.getElementById('filterMaint').value;
      const today = new Date().toISOString().split('T')[0];
      const monthEnd = new Date(new Date().getFullYear(), new Date().getMonth() + 1, 0).toISOString().split('T')[0];
      const monthStart = new Date(new Date().getFullYear(), new Date().getMonth(), 1).toISOString().split('T')[0];

      let filtered = clients.filter(c => {
        const match = !q || c.name.toLowerCase().includes(q) || (c.phone || '').includes(q) || (c.address || '').toLowerCase().includes(q);
        if (!match) return false;
        if (filter === 'this_month') return c.next_maintenance >= monthStart && c.next_maintenance <= monthEnd;
        if (filter === 'overdue') return c.next_maintenance && c.next_maintenance < today;
        return true;
      });

      document.getElementById('countLabel').textContent = `${filtered.length} عميل`;

      const tbody = document.getElementById('clientsTable');
      if (!filtered.length) {
        tbody.innerHTML = '<tr><td colspan="8" style="text-align:center;padding:40px;color:#64748b">لا يوجد عملاء</td></tr>';
        return;
      }

      tbody.innerHTML = filtered.map((c, i) => {
        const status = getClientStatus(c.next_maintenance);
        const badge = statusBadgeHTML(status);

        return `<tr>
          <td>${i + 1}</td>
          <td><strong>${c.name}</strong></td>
          <td>${c.phone || '-'}</td>
          <td>${c.address || '-'}</td>
          <td>${formatDate(c.install_date)}</td>
          <td>${formatDate(c.next_maintenance)} ${badge}</td>
          <td>${session.role === 'admin' ? (parseFloat(c.amount_paid) || 0).toLocaleString('ar-EG') + ' ج' : '—'}</td>
          <td>
            <button class="btn btn-sm btn-outline" onclick="viewClient(${c.id})">عرض</button>
            <button class="btn btn-sm btn-primary" onclick="openEditModal(${c.id})">تعديل</button>
            ${session.role === 'admin' ? `<button class="btn btn-sm btn-danger" onclick="deleteClient(${c.id})">حذف</button>` : ''}
          </td>
        </tr>`;
      }).join('');
    }

    function openAddModal() {
      editingId = null;
      document.getElementById('modalTitle').textContent = 'إضافة عميل جديد';
      ['f_name','f_phone','f_address','f_notes'].forEach(id => document.getElementById(id).value = '');
      document.getElementById('f_amount').value = '';
      document.getElementById('f_install').value = '';
      document.getElementById('f_next_maint').value = '';
      document.getElementById('f_interval').value = '6';
      showModal('clientModal');
    }

    function openEditModal(id) {
      const c = DB.getClients().find(x => x.id === id);
      if (!c) return;
      editingId = id;
      document.getElementById('modalTitle').textContent = 'تعديل بيانات العميل';
      document.getElementById('f_name').value = c.name || '';
      document.getElementById('f_phone').value = c.phone || '';
      document.getElementById('f_address').value = c.address || '';
      document.getElementById('f_amount').value = c.amount_paid || '';
      document.getElementById('f_install').value = c.install_date || '';
      document.getElementById('f_interval').value = c.maintenance_interval_months || '6';
      document.getElementById('f_next_maint').value = c.next_maintenance || '';
      document.getElementById('f_notes').value = c.notes || '';
      showModal('clientModal');
    }

    function saveClient() {
      const name = document.getElementById('f_name').value.trim();
      if (!name) { toast('الاسم مطلوب', 'error'); return; }

      const install = document.getElementById('f_install').value;
      const interval = document.getElementById('f_interval').value;
      let next_maint = document.getElementById('f_next_maint').value;
      if (!next_maint && install) next_maint = addMonths(install, interval);

      const data = {
        name,
        phone: document.getElementById('f_phone').value.trim(),
        address: document.getElementById('f_address').value.trim(),
        amount_paid: parseFloat(document.getElementById('f_amount').value) || 0,
        install_date: install,
        maintenance_interval_months: parseInt(interval),
        next_maintenance: next_maint,
        notes: document.getElementById('f_notes').value.trim(),
      };

      const clients = DB.getClients();
      if (editingId) {
        const idx = clients.findIndex(c => c.id === editingId);
        clients[idx] = { ...clients[idx], ...data };
        toast('تم تحديث بيانات العميل', 'success');
      } else {
        clients.push({ id: genId(), created_at: new Date().toISOString(), ...data });
        toast('تم إضافة العميل', 'success');
      }
      DB.setClients(clients);
      hideModal('clientModal');
      renderTable();
    }

    function deleteClient(id) {
      if (!confirm('هل أنت متأكد من حذف هذا العميل؟')) return;
      DB.setClients(DB.getClients().filter(c => c.id !== id));
      toast('تم الحذف', 'success');
      renderTable();
    }

    function viewClient(id) {
      const c = DB.getClients().find(x => x.id === id);
      const tasks = DB.getTasks().filter(t => t.client_id === id);
      const users = DB.getUsers();
      document.getElementById('viewContent').innerHTML = `
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:20px">
          <div><span style="color:#64748b;font-size:13px">الاسم</span><div style="font-weight:700">${c.name}</div></div>
          <div><span style="color:#64748b;font-size:13px">الهاتف</span><div style="font-weight:700">${c.phone || '-'}</div></div>
          <div><span style="color:#64748b;font-size:13px">العنوان</span><div>${c.address || '-'}</div></div>
          <div><span style="color:#64748b;font-size:13px">تاريخ التركيب</span><div>${formatDate(c.install_date)}</div></div>
          <div><span style="color:#64748b;font-size:13px">موعد الصيانة القادم</span><div><strong style="color:#1a73e8">${formatDate(c.next_maintenance)}</strong></div></div>
          ${session.role === 'admin' ? `<div><span style="color:#64748b;font-size:13px">المبلغ المدفوع</span><div style="font-weight:700;color:#34a853">${(parseFloat(c.amount_paid)||0).toLocaleString('ar-EG')} ج</div></div>` : ''}
        </div>
        ${c.notes ? `<div style="background:#f8fafc;padding:12px;border-radius:10px;margin-bottom:16px;font-size:14px">${c.notes}</div>` : ''}
        <div style="font-weight:700;margin-bottom:12px">سجل الزيارات (${tasks.length})</div>
        ${tasks.length ? tasks.map(t => {
          const tech = users.find(u => u.id === t.technician_id);
          const statusMap = { pending: 'معلق', done_by_tech: 'بانتظار موافقة', confirmed: 'مؤكد', rejected: 'مرفوض' };
          const badgeMap = { pending: 'badge-muted', done_by_tech: 'badge-warning', confirmed: 'badge-success', rejected: 'badge-danger' };
          return `<div style="border:1px solid #e2e8f0;border-radius:10px;padding:14px;margin-bottom:10px">
            <div style="display:flex;justify-content:space-between;align-items:center">
              <span style="font-weight:700">${t.type === 'installation' ? 'تركيب' : t.type === 'maintenance' ? 'صيانة' : 'زيارة'}</span>
              <span class="badge ${badgeMap[t.status]}">${statusMap[t.status]}</span>
            </div>
            <div style="font-size:13px;color:#64748b;margin-top:6px">الفني: ${tech ? tech.name : '-'} | ${formatDate(t.completed_date || t.scheduled_date)}</div>
            ${t.tech_notes ? `<div style="font-size:13px;margin-top:6px">${t.tech_notes}</div>` : ''}
            ${t.image ? `<img src="${t.image}" style="width:100%;max-height:150px;object-fit:cover;border-radius:8px;margin-top:8px;cursor:pointer" onclick="previewImage('${t.image}')">` : ''}
          </div>`;
        }).join('') : '<p style="color:#64748b;text-align:center;padding:20px">لا توجد زيارات مسجلة</p>'}
      `;
      showModal('viewModal');
    }

    function exportCSV() {
      const clients = DB.getClients();
      const rows = [['الاسم','الهاتف','العنوان','تاريخ التركيب','موعد الصيانة','المبلغ','ملاحظات']];
      clients.forEach(c => rows.push([c.name, c.phone||'', c.address||'', c.install_date||'', c.next_maintenance||'', c.amount_paid||0, c.notes||'']));
      const csv = '\uFEFF' + rows.map(r => r.map(v => `"${v}"`).join(',')).join('\n');
      const a = document.createElement('a');
      a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(csv);
      a.download = 'newlife_clients.csv';
      a.click();
    }

    function importCSV(input) {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        const lines = e.target.result.split('\n').slice(1);
        const clients = DB.getClients();
        let added = 0;
        lines.forEach(line => {
          const cols = line.split(',').map(v => v.replace(/^"|"$/g, '').trim());
          if (!cols[0]) return;
          clients.push({
            id: genId(),
            name: cols[0], phone: cols[1], address: cols[2],
            install_date: cols[3], next_maintenance: cols[4],
            amount_paid: parseFloat(cols[5]) || 0, notes: cols[6] || '',
            maintenance_interval_months: 6,
            created_at: new Date().toISOString()
          });
          added++;
        });
        DB.setClients(clients);
        toast(`تم استيراد ${added} عميل`, 'success');
        renderTable();
      };
      reader.readAsText(file, 'UTF-8');
      input.value = '';
    }

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('overlayBg').classList.toggle('show');
    }

    // Auto-calc next maintenance when install date changes
    document.getElementById('f_install').addEventListener('change', function() {
      const interval = document.getElementById('f_interval').value;
      if (this.value) document.getElementById('f_next_maint').value = addMonths(this.value, interval);
    });

    renderTable();
  </script>
</body>
</html>
